version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gzne_bot
    restart: unless-stopped

    # Environment variables from .env file
    env_file:
      - .env

    # Volumes for persistent data
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./locales:/app/locales

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Optional: Add backup service
  backup:
    image: alpine:latest
    container_name: gzne_bot_backup
    restart: "no"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    command: >
      sh -c "
        apk add --no-cache tar gzip &&
        tar -czf /backups/backup-$(date +%Y%m%d-%H%M%S).tar.gz -C /data . &&
        find /backups -name 'backup-*.tar.gz' -mtime +7 -delete
      "
    profiles:
      - backup

  # Optional: Watchtower for auto-updates
  watchtower:
    image: containrrr/watchtower
    container_name: gzne_bot_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 86400 --cleanup gzne_bot
    profiles:
      - autoupdate
